services:
  tiny10:
    image: dockurr/windows:latest
    container_name: tiny10
    network_mode: bridge
    dns:
    - 168.63.129.16
    environment:
      VERSION: "tiny10"
      USERNAME: ${WINDOWS_USERNAME:?Set WINDOWS_USERNAME in .env}
      PASSWORD: ${WINDOWS_PASSWORD:?Set WINDOWS_PASSWORD in .env}
      AUDIO: "Y"
      RAM_SIZE: "8G"
    devices:
      - /dev/kvm:/dev/kvm
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    volumes:
      - ./windows-data:/storage
    ports:
      - "127.0.0.1:8006:8006"
    restart: unless-stopped